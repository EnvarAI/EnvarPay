name: Service container
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - packages/typescript/**
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t envarpay:check .
      - run: docker run --rm --network none envarpay:check --version
      - name: Verify standalone and managed package layout
        run: |
          docker run --rm --network none --entrypoint sh envarpay:check -ec '
            test "$(id -u)" = 10001
            envarpay init --directory /data/check
            envarpay validate --config /data/check/seller.json
            test ! -e /data/check/signer.key
            test -f /opt/envarpay/runtime/native-skill-runner.py
            test -f /opt/envarpay/runtime/hermes-setup-probe.py
            test -f /opt/envarpay/runtime/hermes-skill-inventory.py
            test ! -e /opt/envarpay/dist/index.js
            node /opt/envarpay/dist/commerce/cli.js --help
          '
