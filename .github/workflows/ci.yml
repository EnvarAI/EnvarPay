name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: pytest -q
      - run: python -m build
      - name: Install wheel in a separate environment
        run: |
          python -m venv /tmp/envarpay-wheel
          /tmp/envarpay-wheel/bin/pip install dist/*.whl
          /tmp/envarpay-wheel/bin/envarpay --version
          /tmp/envarpay-wheel/bin/pip check

  # No wallets, API keys or blockchain payments are used by CI.
