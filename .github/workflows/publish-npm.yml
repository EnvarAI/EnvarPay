name: Stable release
on:
  push:
    branches: [main]
    paths:
      - packages/typescript/**
      - Dockerfile
      - .dockerignore
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: envarpay-stable-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  container:
    uses: ./.github/workflows/container.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [verify, container]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-24
          path: package-dist
      - name: Check stable version and immutable npm artifact
        id: npm
        run: node scripts/release.mjs check-npm package-dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing image versions
        id: images
        run: node scripts/release.mjs check-images
      - name: Publish one image under both compatible names
        if: steps.images.outputs.image_state == 'new'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/envarai/envarpay:${{ steps.npm.outputs.version }}
            ghcr.io/envarai/envarpay-commerce:${{ steps.npm.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/EnvarAI/EnvarPay
            org.opencontainers.image.version=${{ steps.npm.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          sbom: true
          provenance: mode=max
      - name: Recover an incomplete image alias publication
        if: steps.images.outputs.image_state == 'copy'
        env:
          IMAGE_SOURCE: ${{ steps.images.outputs.image_source }}
          IMAGE_TARGET: ${{ steps.images.outputs.image_target }}
        run: docker buildx imagetools create --tag "$IMAGE_TARGET" "$IMAGE_SOURCE"
      - name: Verify image identity before npm publication
        run: node scripts/release.mjs verify-images
      - name: Publish the tested tarball to npm latest using Trusted Publishing
        if: steps.npm.outputs.npm_publish == 'true'
        run: npm publish "$GITHUB_WORKSPACE"/package-dist/*.tgz --access public --tag latest --provenance
        working-directory: packages/typescript
      - name: Verify npm latest and tarball integrity
        run: node scripts/release.mjs verify-npm package-dist
      - name: Update stable image aliases
        env:
          RELEASE_VERSION: ${{ steps.npm.outputs.version }}
        run: |
          for image in envarpay envarpay-commerce; do
            docker buildx imagetools create --tag "ghcr.io/envarai/$image:latest" "ghcr.io/envarai/$image:$RELEASE_VERSION"
          done
      - name: Record the release and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.npm.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>"$RUNNER_TEMP/tag-error"); then
            test "$tag_sha" = "$GITHUB_SHA"
          else
            grep -q '(HTTP 404)' "$RUNNER_TEMP/tag-error" || { cat "$RUNNER_TEMP/tag-error" >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>"$RUNNER_TEMP/release-error"; then
            exit 0
          fi
          grep -q '(HTTP 404)' "$RUNNER_TEMP/release-error" || { cat "$RUNNER_TEMP/release-error" >&2; exit 1; }
          printf 'Stable EnvarPay release %s.\n\nnpm: @envarai/envarpay@%s (latest).\nContainer images: ghcr.io/envarai/envarpay:%s and ghcr.io/envarai/envarpay-commerce:%s.\n\nSource: %s\n' "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
