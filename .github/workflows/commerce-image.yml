name: Managed commerce image

on:
  pull_request:
    paths:
      - Dockerfile.commerce
      - packages/typescript/**
      - .github/workflows/commerce-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed 0.2.0-alpha.12 commerce image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        run: |
          if docker buildx imagetools inspect ghcr.io/envarai/envarpay-commerce:0.2.0-alpha.12 >/dev/null 2>&1; then
            echo '::error::The commerce image release tag already exists'
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.commerce
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/envarai/envarpay-commerce:0.2.0-alpha.12
            ghcr.io/envarai/envarpay-commerce:sha-${{ github.sha }}
