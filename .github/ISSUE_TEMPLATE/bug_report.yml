name: Bug report
description: Report a reproducible integration or correctness problem
body:
  - type: markdown
    attributes:
      value: "Never include private keys, API tokens, signed authorizations or state databases. Use private security reporting for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: EnvarPay version, Node.js version and operating system
      description: Include the package version and whether you used npm, source or a container. For native integration, include the Agent runtime version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use redacted configuration and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
